method: probed
source: live HTTP probes of every Blackstone-operated host reachable from apis.yml
provider: Blackstone
providerId: blackstone
description: >-
  Blackstone operates no public developer API host, so the /.well-known/ surface was probed
  against the corporate site, the gated developer documentation site, the BXAccess investor
  portal, the investor-relations host, and the two identity hosts Blackstone runs on its bx.com
  domain. The only genuine discovery documents served anywhere in the estate are the OAuth /
  OpenID Connect metadata published by those two identity hosts: the Okta tenant at
  login.bx.com and the identity broker at auth.bx.com that fronts the BXAccess investor portal.
  Everything else either 403s behind a Cloudflare managed challenge, 307s to an Okta
  visitor-auth wall, or answers 200 with an HTML/error shell that is not a document.
hosts:
  - host: https://login.bx.com
    role: Okta identity tenant (bx.customdomains.okta.com) — firmwide workforce and partner SSO
    documents:
      - path: /.well-known/openid-configuration
        status: 200
        content_type: application/json
        file: blackstone-login-bx-openid-configuration.json
        real_document: true
      - path: /.well-known/oauth-authorization-server
        status: 200
        content_type: application/json
        file: blackstone-login-bx-oauth-authorization-server.json
        real_document: true
        note: >-
          Okta org authorization server. Its scopes_supported list is Okta's own management-API
          scope catalog (okta.users.read, okta.apps.manage, ...), not a Blackstone business API.
      - path: /.well-known/oauth-protected-resource
        status: 405
        real_document: false
      - path: /.well-known/security.txt
        status: 405
        real_document: false
      - path: /.well-known/api-catalog
