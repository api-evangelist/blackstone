apis:
  - aid: blackstone:blackstone-investor-portal
    name: Blackstone Investor Portal
    description: >-
      Blackstone provides institutional and individual investors with access to portfolio
      information, capital account statements, fund documents, and reporting through its
      Investor Portal, which is served at www.bxaccess.com (BXAccess). The portal is a
      login-only surface: every unauthenticated path 302s to /auth/login and authentication
      runs against Blackstone's own OpenID Connect identity broker at auth.bx.com. API
      integrations may be available for institutional investors and data aggregation platforms
      under direct agreement with Blackstone; none is publicly documented.
    humanURL: https://www.blackstone.com/investor-resources/
    baseURL: https://www.bxaccess.com
    x-evidence:
      baseURL_method: probed
      baseURL_fetched: '2026-08-10'
      baseURL_source: https://www.bxaccess.com/bxa-next/env.json
      baseURL_note: >-
        www.bxaccess.com is the live host of the Blackstone Investor Portal (HTTP 200, title
        "Investor Portal"). Its own published SPA bundle references first-party service paths
        including /api-services/v1/documents, /portal/documents and /auth/bearerTokenAuthentication,
        and its unauthenticated runtime config at /bxa-next/env.json declares the OIDC provider.
        This is the portal's own backend, observed — NOT a documented public API. There is no
        public API reference and /api-services/v1/documents returns 404 to anonymous callers.
    tags:
      - Alternative Assets
      - Finance
      - Investment Management
      - Private Equity
