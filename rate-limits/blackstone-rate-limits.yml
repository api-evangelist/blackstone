specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Blackstone
providerId: blackstone
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Alternative Assets
  - Investment Management
  - Rate Limiting
description: Blackstone does not publish a public API rate-limit policy. The firm operates as an
  asset manager rather than a developer-facing platform; any integration controls live inside LP / GP
  / portfolio-company contracts.
sources:
  - https://www.blackstone.com/our-businesses/
notes: No public API rate-limit documentation identified.
responseCodes:
  throttled: 429
limits:
  - name: Partner / portfolio integration
    scope: contract
    metric: varies
    limit: see partner / portfolio-company agreement
    notes: Numeric throttling, concurrency, and quota windows governed by individual partner
      contracts; no public values exist.
policies:
  - name: Backoff
    description: Clients receiving a 429 should respect Retry-After when present and apply
      exponential backoff with jitter.
  - name: Contractual escalation
    description: Throttling adjustments and quota raises are handled through the Blackstone
      relationship contact rather than self-service.
maintainers:
