        name: partner_access
        type: subscription
        metric: varies
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: LP / portfolio-company contract required
      - name: NDA and compliance review
