description: Blackstone is an alternative asset manager (private equity, real estate, credit, life
  sciences) and does not publish a developer / API pricing surface. The firm's revenue model is
  management fees and carried interest on AUM, not API consumption. This artifact is a placeholder
  in case partner / portfolio-company integrations are exposed in the future.
sources:
  - https://www.blackstone.com/our-businesses/
notes: No public API or developer pricing identified at blackstone.com. All commercial relationships
  are LP / GP / portfolio-company contracts, not API plans.
plans:
