specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Blackstone
providerId: blackstone
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Alternative Assets
  - Investment Management
description: 'FOCUS-aligned FinOps placeholder for Blackstone: not a developer-facing platform.
  Spend with Blackstone is captured as fund-level fees (management fee + carried interest) and any
  portfolio-company contracts, not API consumption.'
sources:
  - https://www.blackstone.com/our-businesses/
notes: Blackstone has no public API billing surface; this artifact exists for symmetry with peer
  providers and should be revisited only if a developer offering launches.
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: The Blackstone Group Inc.
serviceCategory: Alternative Asset Management
billingModel:
  pricingCategory: Fund Fees (Management + Carry) / Contract
  billingFrequency: Per-Contract
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Blackstone
  ServiceCategory: Alternative Asset Management
  ProviderName: Blackstone
  PublisherName: The Blackstone Group Inc.
  InvoiceIssuerName: The Blackstone Group Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: management_fees
    unit: USD
    aggregation: sum
    dimensions:
      - fund
      - vintage
  - name: carried_interest
    unit: USD
    aggregation: sum
    dimensions:
      - fund
      - vintage
  - name: portfolio_company_contracts
    unit: contract
    aggregation: count
    dimensions:
      - portfolio_company
      - region
principles:
  - name: Visibility
    description: Use LP capital-account statements and quarterly fund reporting from Blackstone
      Investor Relations; no API telemetry exists.
  - name: Allocation
    description: Map fund commitments and side-letter terms to consuming entities through the LP
      reporting pack.
  - name: Optimization
    description: Negotiate side-letter fee discounts at commitment time; consolidate commitments
      across affiliates to reach fee-tier breakpoints.
  - name: Accountability
    description: Designate an LP-relations owner per fund commitment; review fund performance and
      fee burn each quarter.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
